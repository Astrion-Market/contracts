name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build WASM
        run: cargo build --workspace --target wasm32v1-none --release
      - name: WASM size report
        run: |
          mkdir -p artifacts
          find target/wasm32v1-none/release -maxdepth 1 -name '*.wasm' -printf '%f %s bytes\n' | sort > artifacts/wasm-sizes.txt
          cat artifacts/wasm-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: artifacts/wasm-sizes.txt

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect test output
        run: |
          mkdir -p coverage
          cargo test --workspace -- --format terse | tee coverage/test-output.txt
          tar -czf coverage-artifacts.tar.gz coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: coverage-artifacts.tar.gz

  # ─── EVM execution layer: independent of the Rust job ──────────────────────
  evm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: FOUNDRY_PROFILE=ci forge test --no-match-path 'test/fork/*'
      - name: Preserve failing fuzz/invariant seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evm-failing-seeds-${{ github.sha }}
          path: |
            evm/cache/fuzz
            evm/cache/invariant

  # ─── EVM fork suites: explicit SKIPPED status without RPC secrets ─────────
  evm-fork:
    runs-on: ubuntu-latest
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Report skipped fork suites
        if: env.BASE_RPC_URL == '' && env.ETH_RPC_URL == ''
        run: |
          echo "::warning::Fork suites SKIPPED: BASE_RPC_URL / ETH_RPC_URL secrets are not configured."
          echo "## EVM fork tests: SKIPPED (no RPC secrets configured)" >> "$GITHUB_STEP_SUMMARY"
      - name: Fork tests
        if: env.BASE_RPC_URL != '' || env.ETH_RPC_URL != ''
        run: forge test --match-path 'test/fork/*' -vv

  # ─── TypeScript SDK: same vectors as libs/crosschain-types ────────────────
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test

  # ─── Relayer service: restart/reorg/property tests ────────────────────────
  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/relayer
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: RELAYER_PROPERTY_SEEDS=200 bun test
